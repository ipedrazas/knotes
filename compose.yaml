# knotes on the VM, behind Nginx Proxy Manager (knotes.andcake.dev -> this host:3000).
#
#   mkdir -p notes && sudo chown 1000:1000 notes    # the container runs as uid 1000
#   docker compose pull && docker compose up -d
#
# In NPM, switch on "Websockets Support" for the proxy host: live editing runs over a
# websocket at /collab, and nothing syncs without it.
services:
  knotes:
    image: ghcr.io/ipedrazas/knotes:latest
    container_name: knotes
    restart: unless-stopped
    # Forwards SIGTERM so the server saves open notes before it stops.
    init: true
    stop_grace_period: 20s
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /data
    volumes:
      # Your notes, as plain .md files. This is the folder to back up.
      - ./notes:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
