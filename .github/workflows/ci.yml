name: CI

on:
  pull_request:
  push:
    branches: [main]
  # publish.yml runs this first and only builds the image if it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so this never cancels a publish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Markdown round-trips and the on-disk store (renames, Yjs state, trash).
      - run: npm test

      - run: npx vite build
